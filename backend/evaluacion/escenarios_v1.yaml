# =============================================================================
# SAAC · Conjunto de escenarios simulados para la evaluación (capítulo 5)
#
# Cada escenario representa a un estudiante simulado nuevo (cuenta propia) que
# realiza una secuencia de eventos: mensajes, respuestas a los cuestionarios,
# respuestas a la verificación directa, rechazos de ofrecimientos y aceptación de
# la derivación.
#
# Los resultados esperados se asignaron ANTES de ejecutar la plataforma, aplicando
# a mano los criterios documentados (tablas 20 a 23 y 27 del documento) al
# SIGNIFICADO de cada mensaje, y no a las expresiones que reconoce el léxico.
#
# forma:
#   canonica   -> usa la redacción del ítem del instrumento o los ejemplos
#                 documentados en las tablas 20 y 27
#   parafrasis -> expresa el mismo constructo con otras palabras o con
#                 expresiones coloquiales guatemaltecas
#   n/a        -> escenarios guiados por cuestionarios o por reglas de supresión
#
# Ningún texto proviene de personas reales.
# =============================================================================

version: "1.0"

